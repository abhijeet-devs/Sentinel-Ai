version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./sentinelai.db
      - SECRET_KEY=sentinelai-super-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    volumes:
      - sentinelai_db:/app
      - ./backend/ml_models:/app/ml_models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - sentinelai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelai-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelai-net

volumes:
  sentinelai_db:

networks:
  sentinelai-net:
    driver: bridge
